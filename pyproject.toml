[project]
name = "topdeck"
version = "0.1.0"
description = "Questions about Magic: The Gathering cards, answered five ways, with every answer scored by code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
topdeck = "topdeck.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topdeck"]

[tool.ruff]
line-length = 100
# The 2024 code is kept byte for byte, so no formatter or linter may touch it.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
