name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --locked fails if uv.lock is out of date, so CI installs exactly what was tested.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No test may reach the network: no key, no cost.
      - run: uv run pytest
      - run: uv run topdeck ground
